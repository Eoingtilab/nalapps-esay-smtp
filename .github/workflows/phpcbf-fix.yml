name: PHPCBF Correction Artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install WPCS
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Apply PHPCBF formatting fixes
        shell: bash
        run: |
          set +e
          vendor/bin/phpcbf --standard=phpcs.xml.dist \
            includes/class-smtp.php \
            includes/class-system-status.php \
            includes/class-mail-api.php \
            includes/class-update-manager.php
          status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          exit 0
      - name: Verify corrected files with PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist includes/class-smtp.php includes/class-system-status.php includes/class-mail-api.php includes/class-update-manager.php
      - name: Upload corrected source files
        uses: actions/upload-artifact@v4
        with:
          name: phpcbf-corrected-source
          path: |
            includes/class-smtp.php
            includes/class-system-status.php
            includes/class-mail-api.php
            includes/class-update-manager.php
          if-no-files-found: error
