name: WPCS Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install WPCS
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Run WPCS and capture report
        id: phpcs
        shell: bash
        run: |
          set +e
          vendor/bin/phpcs --standard=phpcs.xml.dist -s --report=json > phpcs-report.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload WPCS report
        uses: actions/upload-artifact@v4
        with:
          name: wpcs-diagnostic-report
          path: phpcs-report.json
          if-no-files-found: error
      - name: Preserve failing status
        if: steps.phpcs.outputs.exit_code != '0'
        run: exit 1
